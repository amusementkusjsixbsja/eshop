worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker DNS 解析器
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        charset utf-8;

        # ========== API 代理（共用 WebSocket 升级头） ==========
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ========== C 端：用户认证 → user-product:8001 ==========
        location ~ ^/api/shop(/c-endpoint/auth.*)$ {
            set $backend "http://user-product:8001";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：商品浏览（含分类树） → user-product:8001
        location ~ ^/api/shop(/c-endpoint/products.*)$ {
            set $backend "http://user-product:8001";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：分类树 → user-product:8001
        location ~ ^/api/shop(/c-endpoint/categories.*)$ {
            set $backend "http://user-product:8001";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：地址管理 → user-product:8001
        location ~ ^/api/shop(/c-endpoint/addresses.*)$ {
            set $backend "http://user-product:8001";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：评价 → user-product:8001
        location ~ ^/api/shop(/c-endpoint/reviews.*)$ {
            set $backend "http://user-product:8001";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：购物车 → order-trade:8002
        location ~ ^/api/shop(/c-endpoint/cart.*)$ {
            set $backend "http://order-trade:8002";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：订单 → order-trade:8002
        location ~ ^/api/shop(/c-endpoint/orders.*)$ {
            set $backend "http://order-trade:8002";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：物流 → order-trade:8002
        location ~ ^/api/shop(/c-endpoint/logistics.*)$ {
            set $backend "http://order-trade:8002";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # C 端：售后 → order-trade:8002
        location ~ ^/api/shop(/c-endpoint/after-sales.*)$ {
            set $backend "http://order-trade:8002";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # B 端：管理后台 → admin:8003
        location ~ ^/api/shop(/b-endpoint.*)$ {
            set $backend "http://admin:8003";
            proxy_pass $backend$1$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== AI 客服 → ai-service:8004 ==========
        # AI 服务期望完整路径 /api/ai/chat，用 $request_uri 保持原样
        location /api/ai {
            set $backend "http://ai-service:8004";
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========== 内部接口 — 公网拒绝 ==========
        location /internal/ {
            return 403;
        }

        # ========== 前端页面 → frontend:5173 ==========
        location / {
            set $backend "http://frontend:5173";
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
